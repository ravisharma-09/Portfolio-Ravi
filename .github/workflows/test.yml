name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check logic.js && node --check main.js && node --check arcade.js && node --check world.js && node --check touch.js
      - run: node --test
